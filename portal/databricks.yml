bundle:
  name: datapf-portal

resources:
  apps:
    datapf-portal:
      name: datapf-portal
      source_code_path: .
      description: "データ基盤ポータル — Databricks Apps"
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

variables:
  warehouse_id:
    description: "Databricks SQL Warehouse ID"
  DEV_WAREHOUSE_ID:
    description: "開発用 Databricks SQL Warehouse ID"
  PROD_WAREHOUSE_ID:
    description: "本番用 Databricks SQL Warehouse ID"


targets:
  dev:
    default: true
    variables:
      warehouse_id: ${var.DEV_WAREHOUSE_ID}
  prod:
    variables:
      warehouse_id: ${var.PROD_WAREHOUSE_ID}
