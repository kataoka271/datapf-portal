# ==============================================================================
# GitHub Actions — CI/CD ワークフロー
#
# トリガー:
#   - PR → main:  テスト・型チェック・Terraform plan
#   - push main:  dev 環境への自動デプロイ
#   - tag v*.*.*: prod 環境への手動承認付きデプロイ
# ==============================================================================

name: Portal CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-northeast-1
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  TF_VERSION: "1.7.5"

jobs:
  # ============================================================================
  # 1. バックエンドテスト
  # ============================================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # ============================================================================
  # 2. フロントエンド型チェック・ビルド確認
  # ============================================================================
  test-frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # 3. Terraform 検証（PR 時）
  # ============================================================================
  tf-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform/

      - name: Terraform Validate (dev)
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate (prod)
        working-directory: infra/terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

  # ============================================================================
  # 4. Terraform Plan（PR 時、AWS 認証あり）
  # ============================================================================
  tf-plan-dev:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test-backend, test-frontend, tf-validate]
    environment: dev-plan

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create dummy ZIP files for plan
        run: |
          echo "dummy" > backend/lambda.zip
          echo "dummy" > backend/layer.zip

      - name: Terraform Init
        working-directory: infra/terraform/environments/dev
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform/environments/dev
        run: |
          terraform plan \
            -var="databricks_host=${{ secrets.DATABRICKS_HOST }}" \
            -var="databricks_sp_client_id=${{ secrets.DATABRICKS_SP_CLIENT_ID }}" \
            -var="databricks_sp_client_secret=${{ secrets.DATABRICKS_SP_CLIENT_SECRET }}" \
            -var="databricks_sql_warehouse_id=${{ secrets.DATABRICKS_SQL_WAREHOUSE_ID }}" \
            -var="oidc_issuer=${{ secrets.OIDC_ISSUER }}" \
            -var="oidc_jwks_uri=${{ secrets.OIDC_JWKS_URI }}" \
            -var="oidc_audience=${{ secrets.OIDC_AUDIENCE }}" \
            -var="idc_client_id=${{ secrets.IDC_CLIENT_ID }}" \
            -var="idc_client_secret=${{ secrets.IDC_CLIENT_SECRET }}" \
            -var="ses_sender_email=${{ secrets.SES_SENDER_EMAIL }}" \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/environments/dev/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan (dev)\n\`\`\`\n${truncated}\n\`\`\``
            });

  # ============================================================================
  # 5. dev 環境デプロイ（main ブランチへの push 時）
  # ============================================================================
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend]
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Lambda layer
        run: |
          pip install -r backend/requirements.txt \
            -t backend/layer_build/python \
            --platform mlinux_2_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade
          cd backend/layer_build && zip -r ../layer.zip python/
          rm -rf backend/layer_build

      - name: Build Lambda function
        run: |
          cd backend && zip -r lambda.zip app/ \
            -x "**/__pycache__/*" -x "**/*.pyc"

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build
        env:
          VITE_API_BASE_URL: /v1

      - name: Terraform Apply
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init
          terraform apply \
            -var="databricks_host=${{ secrets.DATABRICKS_HOST }}" \
            -var="databricks_sp_client_id=${{ secrets.DATABRICKS_SP_CLIENT_ID }}" \
            -var="databricks_sp_client_secret=${{ secrets.DATABRICKS_SP_CLIENT_SECRET }}" \
            -var="databricks_sql_warehouse_id=${{ secrets.DATABRICKS_SQL_WAREHOUSE_ID }}" \
            -var="oidc_issuer=${{ secrets.OIDC_ISSUER }}" \
            -var="oidc_jwks_uri=${{ secrets.OIDC_JWKS_URI }}" \
            -var="oidc_audience=${{ secrets.OIDC_AUDIENCE }}" \
            -var="idc_client_id=${{ secrets.IDC_CLIENT_ID }}" \
            -var="idc_client_secret=${{ secrets.IDC_CLIENT_SECRET }}" \
            -var="ses_sender_email=${{ secrets.SES_SENDER_EMAIL }}" \
            -auto-approve

      - name: Upload frontend to S3
        working-directory: infra/terraform/environments/dev
        run: |
          BUCKET=$(terraform output -raw frontend_bucket)
          aws s3 sync ../../frontend/dist/ s3://${BUCKET}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp ../../frontend/dist/index.html s3://${BUCKET}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        working-directory: infra/terraform/environments/dev
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation \
            --distribution-id ${DIST_ID} \
            --paths "/*"

      - name: Output deploy URL
        working-directory: infra/terraform/environments/dev
        run: |
          echo "✅ Deployed to: $(terraform output -raw cloudfront_url)"

  # ============================================================================
  # 6. prod 環境デプロイ（v*.*.* タグ push 時・手動承認あり）
  # ============================================================================
  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test-backend, test-frontend]
    environment: prod   # GitHub Environments で Required Reviewers を設定すること

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build all artifacts
        run: |
          pip install -r backend/requirements.txt \
            -t backend/layer_build/python \
            --platform mlinux_2_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade
          cd backend/layer_build && zip -r ../layer.zip python/ && cd ../..
          rm -rf backend/layer_build
          cd backend && zip -r lambda.zip app/ \
            -x "**/__pycache__/*" -x "**/*.pyc" && cd ..
          cd frontend && npm ci && npm run build
        env:
          VITE_API_BASE_URL: /v1

      - name: Terraform Apply
        working-directory: infra/terraform/environments/prod
        run: |
          terraform init
          terraform apply \
            -var="databricks_host=${{ secrets.DATABRICKS_HOST_PROD }}" \
            -var="databricks_sp_client_id=${{ secrets.DATABRICKS_SP_CLIENT_ID_PROD }}" \
            -var="databricks_sp_client_secret=${{ secrets.DATABRICKS_SP_CLIENT_SECRET_PROD }}" \
            -var="databricks_sql_warehouse_id=${{ secrets.DATABRICKS_SQL_WAREHOUSE_ID_PROD }}" \
            -var="oidc_issuer=${{ secrets.OIDC_ISSUER_PROD }}" \
            -var="oidc_jwks_uri=${{ secrets.OIDC_JWKS_URI_PROD }}" \
            -var="oidc_audience=${{ secrets.OIDC_AUDIENCE_PROD }}" \
            -var="idc_client_id=${{ secrets.IDC_CLIENT_ID_PROD }}" \
            -var="idc_client_secret=${{ secrets.IDC_CLIENT_SECRET_PROD }}" \
            -var="ses_sender_email=${{ secrets.SES_SENDER_EMAIL_PROD }}" \
            -var="custom_domain=${{ secrets.CUSTOM_DOMAIN_PROD }}" \
            -var="acm_certificate_arn=${{ secrets.ACM_CERT_ARN_PROD }}" \
            -var="route53_zone_id=${{ secrets.ROUTE53_ZONE_ID_PROD }}" \
            -var="alarm_sns_arn=${{ secrets.ALARM_SNS_ARN_PROD }}" \
            -auto-approve

      - name: Upload frontend to S3
        working-directory: infra/terraform/environments/prod
        run: |
          BUCKET=$(terraform output -raw frontend_bucket)
          aws s3 sync ../../frontend/dist/ s3://${BUCKET}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp ../../frontend/dist/index.html s3://${BUCKET}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        working-directory: infra/terraform/environments/prod
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation \
            --distribution-id ${DIST_ID} \
            --paths "/*"

      - name: Output deploy URL
        working-directory: infra/terraform/environments/prod
        run: |
          echo "✅ Deployed to prod: $(terraform output -raw cloudfront_url)"
          echo "🏷️  Version: ${{ github.ref_name }}"
