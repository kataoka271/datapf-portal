command:
  - uvicorn
  - app.main:app
  - --host
  - "0.0.0.0"
  - --port
  - "${DATABRICKS_APP_PORT:-8000}"
env:
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DEV_MODE
    value: "false"
  - name: PORTAL_CATALOG
    value: "portal"
  - name: AWS_REGION
    value: "ap-northeast-1"
  # Set these via Databricks Apps secrets for video (S3) and email (SES) features:
  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_VIDEO_BUCKET, AWS_SES_SENDER
