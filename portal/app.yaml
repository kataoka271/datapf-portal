command: ["uvicorn", "backend.app.main:app"]
env:
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DEV_MODE
    value: "true"
  - name: PORTAL_CATALOG
    value: "portal"
  - name: AWS_REGION
    value: "ap-northeast-1"
  # Set these via Databricks Apps secrets for video (S3) and email (SES) features:
  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_VIDEO_BUCKET, AWS_SES_SENDER
  - name: DEV_USER_ID
    value: "dev-user-001"
  - name: DEV_USER_EMAIL
    value: "dev@example.com"
  - name: DEV_USER_NAME
    value: "開発ユーザー"
